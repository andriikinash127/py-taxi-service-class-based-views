{% extends "base.html" %}

{% block content %}
  <h1>Car list</h1>
  <table>
  <tr>
    <th>Model</th>
    <th>Manufacturer</th>
  </tr>

  {% for car in car_list %}
    <tr>
      <td>
        <a href="{% url 'taxi:car-detail' pk=car.id %}">
          {{ car.model }}
        </a>
      </td>
      <td>{{ car.manufacturer }}</td>
    </tr>
  {% endfor %}
</table>
{% endblock %}
